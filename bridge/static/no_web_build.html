<body><main><h1>MetaMuse Stage：Web 書き出しがまだありません</h1>
<p>ブリッジは動いていますが、<code>web/</code> に Godot の Web 書き出しが見つかりません。</p>
<p>Godot 4.7.2 の Web 用エクスポートテンプレートを導入してから <code>tools\export_web.cmd</code> を実行してください。
それまでは <code>launcher\panel_manager.py</code> の <code>game_mode</code> を <code>native</code>（既定の <code>auto</code> でも可）にすると、Godot のネイティブ窓でゲームを開きます。</p>
<p>ブリッジの状態は <a href="/health" style="color:#f3a8c0">/health</a> で確認できます。</p></main></body></html>
