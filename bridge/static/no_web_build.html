<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>MuseStudio のブリッジ</title>
<style>body{font-family:"Noto Sans JP","Yu Gothic UI",sans-serif;background:#111318;color:#e8e6ef;display:grid;place-items:center;height:100vh;margin:0}
main{max-width:640px;line-height:1.7;padding:24px}code{background:#262a35;padding:2px 6px;border-radius:4px}h1{font-size:20px}</style></head>
<body><main><h1>MuseStudio のブリッジは動いています</h1>
<p>MuseStudio（原作の CharaStudio を作り替えたもの）は、ブラウザではなく、起動役 <code>launcher\start.cmd</code>（または <code>MuseStudio\game\CharaStudio.exe</code>）で開きます。</p>
<p>このページは、前の Godot 版（MetaMuse Stage）の Web 書き出しの置き場 <code>web/</code> が空のときに出ます。MuseStudio には要りません。</p>
<p>ブリッジの状態は <a href="/health" style="color:#f3a8c0">/health</a> で確認できます。</p></main></body></html>
